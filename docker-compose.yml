services:
  backend:
    image: tokenpress-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: tokenpress-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - tokenpress-data:/app/apps/server/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - SITE_URL=${SITE_URL}
      - FRONTEND_URL=http://localhost:3001
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: tokenpress-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: tokenpress-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - SITE_URL=${SITE_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - BACKEND_URL=http://backend:4001
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: tokenpress-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3001}:80"
      - "${HTTPS_PORT:-3443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - tokenpress-uploads:/app/apps/server/uploads:ro
    depends_on:
      - backend
      - frontend

volumes:
  tokenpress-data:
    name: tokenpress-data
  tokenpress-uploads:
    name: tokenpress-uploads