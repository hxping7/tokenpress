<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Token00 · 极简冷光欢迎页</title>
<style>
  :root { --accent: #5ad1ff; --ink: #cfe9ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #04060c; overflow: hidden; }
  body { font-family: "PingFang SC", "Microsoft YaHei", -apple-system, system-ui, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; }
  .ui {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; padding-bottom: 11vh;
    pointer-events: none; opacity: 0; transition: opacity 1.1s ease;
  }
  .ui.show { opacity: 1; pointer-events: auto; }
  .btns { display: flex; gap: 18px; }
  .btn {
    pointer-events: auto; cursor: pointer; user-select: none;
    padding: 14px 40px; font-size: 16px; letter-spacing: 4px;
    color: var(--ink); background: rgba(90,209,255,0.04);
    border: 1px solid rgba(90,209,255,0.45); border-radius: 2px;
    backdrop-filter: blur(6px); transition: all .35s ease;
  }
  .btn:hover { background: rgba(90,209,255,0.16); border-color: var(--accent);
    color: #fff; box-shadow: 0 0 24px rgba(90,209,255,0.35); }
  .btn.primary { color: #04060c; background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover { background: #fff; box-shadow: 0 0 28px rgba(90,209,255,0.6); }
  .cap {
    position: fixed; left: 0; right: 0; top: 16vh; text-align: center;
    color: rgba(207,233,255,0.92); letter-spacing: 8px; font-size: 22px;
    font-weight: 300; opacity: 0; transition: opacity 1s ease;
  }
  .cap.show { opacity: 1; }
  .sub {
    position: fixed; left: 0; right: 0; top: calc(16vh + 40px); text-align: center;
    color: rgba(207,233,255,0.4); letter-spacing: 3px; font-size: 12px; opacity: 0;
    transition: opacity 1s ease;
  }
  .sub.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap" id="cap">智能，正在降临</div>
<div class="sub" id="sub">AI INTELLIGENCE · INCOMING</div>
<div class="ui" id="ui">
  <div class="btns">
    <div class="btn primary" id="enter">进 入</div>
    <div class="btn" id="replay">重 播</div>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const cap = document.getElementById('cap');
  const sub = document.getElementById('sub');
  const ui = document.getElementById('ui');
  let W, H, DPR, cx, cy;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2; cy = H / 2;
  }
  window.addEventListener('resize', resize); resize();

  const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
  const easeIn = t => t * t * t;
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---- AI 元素（细线字形）----
  const glyphs = ['AI', '◈', '△', '○', '⬡', '✦', '⌁', '◇'];
  const N = 8;
  const items = [];
  function spawn() {
    items.length = 0;
    for (let i = 0; i < N; i++) {
      const ang = (i / N) * Math.PI * 2 + rand(-0.2, 0.2);
      const r = Math.max(W, H) * 0.72;
      const sx = cx + Math.cos(ang) * r;
      const sy = cy + Math.sin(ang) * r * 0.92;
      // 目标：壁垒表面某点
      const side = Math.random() < 0.5 ? -1 : 1;
      const tx = cx + side * barrierW() * 0.5;
      const ty = cy + rand(-barrierH() * 0.4, barrierH() * 0.4);
      items.push({
        ch: glyphs[i % glyphs.length], sx, sy, tx, ty,
        size: rand(16, 30), rot: rand(0, Math.PI * 2),
        delay: rand(0, 0.5), trail: []
      });
    }
  }
  const barrierW = () => Math.min(W * 0.16, 150);
  const barrierH = () => Math.min(H * 0.66, 520);

  // ---- 撞击火花 ----
  let sparks = [];
  function burst() {
    sparks = [];
    for (let i = 0; i < 46; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(1.5, 6.5);
      sparks.push({ a, sp, x: cx, y: cy, life: 1, len: rand(6, 22) });
    }
  }

  // ---- 文明星网 ----
  const nodes = [];
  function buildNet() {
    nodes.length = 0;
    const m = 14;
    for (let i = 0; i < m; i++) {
      const a = (i / m) * Math.PI * 2;
      const r = rand(barrierW() * 0.9, barrierW() * 2.4);
      nodes.push({ a, r, base: r, ph: rand(0, Math.PI * 2), x: 0, y: 0 });
    }
  }

  let cracks = [];
  function buildCracks() {
    cracks = [];
    const n = 11;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const len = rand(barrierW() * 0.4, barrierW() * 1.6);
      cracks.push({ a, len, seg: rand(4, 9) });
    }
  }

  spawn(); buildNet(); buildCracks();

  const T_APPROACH = 2.4, T_IMPACT = 3.4, T_BLOOM = 3.6, T_RIPPLE = 6.0, T_END = 8.2;
  let start = performance.now();
  let ripples = [];
  let reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function reset() {
    start = performance.now();
    sparks = []; cracks = []; ripples = []; spawn(); buildNet(); buildCracks();
    ui.classList.remove('show'); cap.classList.remove('show'); sub.classList.remove('show');
  }
  document.getElementById('replay').addEventListener('click', reset);
  document.getElementById('enter').addEventListener('click', () => {
    if (window.self !== window.top) window.parent.postMessage({ type: 'welcome:close' }, '*');
    else { const f = document.body; f.style.transition = 'opacity .6s'; f.style.opacity = '0';
      setTimeout(() => { f.style.opacity = '1'; }, 600); }
  });

  function drawBarrier(alpha) {
    const bw = barrierW(), bh = barrierH();
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = 'rgba(207,233,255,0.55)';
    ctx.lineWidth = 1;
    // 外框
    ctx.strokeRect(cx - bw / 2, cy - bh / 2, bw, bh);
    // 内部网格
    ctx.strokeStyle = 'rgba(207,233,255,0.18)';
    const cols = 4, rows = 14;
    for (let i = 1; i < cols; i++) {
      const x = cx - bw / 2 + (bw / cols) * i;
      ctx.beginPath(); ctx.moveTo(x, cy - bh / 2); ctx.lineTo(x, cy + bh / 2); ctx.stroke();
    }
    for (let j = 1; j < rows; j++) {
      const y = cy - bh / 2 + (bh / rows) * j;
      ctx.beginPath(); ctx.moveTo(cx - bw / 2, y); ctx.lineTo(cx + bw / 2, y); ctx.stroke();
    }
    ctx.restore();
  }

  function frame(now) {
    const t = (now - start) / 1000;
    ctx.clearRect(0, 0, W, H);
    // 背景：极淡渐变 + 暗角
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
    g.addColorStop(0, '#0a1020'); g.addColorStop(1, '#04060c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    if (reduced) {
      drawBarrier(0); drawNet(1); drawRippleStatic();
      if (!ui.classList.contains('show')) {
        ui.classList.add('show'); cap.textContent = '进入 AI 科技文明'; cap.classList.add('show'); sub.classList.add('show');
      }
      requestAnimationFrame(frame); return;
    }

    // 文案
    if (t > 0.3 && t < T_IMPACT) { cap.textContent = '智能，正在降临'; cap.classList.add('show'); sub.classList.add('show'); }
    if (t >= T_IMPACT) { cap.textContent = '进入 AI 科技文明'; }

    // 阶段：汇聚
    if (t < T_IMPACT) {
      const ba = t < T_APPROACH ? 1 : Math.max(0, 1 - (t - T_APPROACH) / (T_IMPACT - T_APPROACH));
      drawBarrier(ba * 0.9);
      items.forEach(it => {
        const lt = (t - it.delay) / (T_APPROACH - it.delay);
        const p = easeIn(Math.max(0, Math.min(1, lt)));
        const x = it.sx + (it.tx - it.sx) * p;
        const y = it.sy + (it.ty - it.sy) * p;
        it.trail.push({ x, y });
        if (it.trail.length > 14) it.trail.shift();
        // 拖尾
        for (let k = 0; k < it.trail.length - 1; k++) {
          ctx.globalAlpha = (k / it.trail.length) * 0.4;
          ctx.strokeStyle = '#5ad1ff'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(it.trail[k].x, it.trail[k].y);
          ctx.lineTo(it.trail[k + 1].x, it.trail[k + 1].y); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.save(); ctx.translate(x, y); ctx.rotate(it.rot + p * 2);
        ctx.fillStyle = '#cfe9ff'; ctx.font = it.size + 'px system-ui';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.shadowColor = '#5ad1ff'; ctx.shadowBlur = 12;
        ctx.fillText(it.ch, 0, 0); ctx.restore();
      });
    }

    // 阶段：撞击
    if (t >= T_APPROACH && t < T_BLOOM) {
      const k = (t - T_APPROACH);
      drawBarrier(Math.max(0, 0.9 - k * 1.4));
      // 裂纹
      ctx.save(); ctx.translate(cx, cy); ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.4; ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
      const ce = ease(Math.min(1, k / 0.7));
      cracks.forEach(c => {
        let px = 0, py = 0;
        for (let s = 1; s <= c.seg; s++) {
          const rr = (c.len / c.seg) * s * ce;
          const wob = Math.sin(s * 1.7) * 6 * (s / c.seg);
          const nx = Math.cos(c.a) * rr - Math.sin(c.a) * wob;
          const ny = Math.sin(c.a) * rr + Math.cos(c.a) * wob;
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(nx, ny); ctx.stroke();
          px = nx; py = ny;
        }
      });
      ctx.restore();
      // 冲击波
      const wr = k * 520;
      ctx.globalAlpha = Math.max(0, 0.5 - k * 0.6);
      ctx.strokeStyle = '#9fe4ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, wr, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      if (sparks.length === 0) burst();
      sparks.forEach(s => {
        s.x = cx + Math.cos(s.a) * s.sp * k * 60;
        s.y = cy + Math.sin(s.a) * s.sp * k * 60;
        s.life = Math.max(0, 1 - k / 0.8);
        ctx.globalAlpha = s.life; ctx.strokeStyle = '#dff4ff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - Math.cos(s.a) * s.len * s.life, s.y - Math.sin(s.a) * s.len * s.life); ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }

    // 阶段：绽放（文明星网）
    if (t >= T_BLOOM) {
      const be = ease(Math.min(1, (t - T_BLOOM) / 1.2));
      drawNet(be);
    }

    // 阶段：水波纹收束
    if (t >= T_RIPPLE) {
      const rk = (t - T_RIPPLE);
      if (t < T_RIPPLE + 0.05) { ripples = []; for (let i = 0; i < 3; i++) ripples.push(i * 0.35); }
      ripples.forEach((off, i) => {
        const rr = (rk - off) * 240;
        if (rr > 0 && rr < Math.max(W, H)) {
          ctx.globalAlpha = Math.max(0, 0.4 - (rk - off) * 0.18);
          ctx.strokeStyle = '#5ad1ff'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
        }
      });
      ctx.globalAlpha = 1;
    }

    if (t > T_END - 1.2 && !ui.classList.contains('show')) {
      ui.classList.add('show'); cap.classList.add('show'); sub.classList.add('show');
    }
    if (t > T_END + 4) reset();
    requestAnimationFrame(frame);
  }

  function drawNet(alpha) {
    ctx.save(); ctx.globalAlpha = alpha;
    nodes.forEach(n => {
      const rr = n.base + Math.sin(performance.now() / 900 + n.ph) * 10;
      n.x = cx + Math.cos(n.a) * rr; n.y = cy + Math.sin(n.a) * rr;
    });
    ctx.strokeStyle = 'rgba(90,209,255,0.35)'; ctx.lineWidth = 1;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
        if (d < barrierW() * 1.8) {
          ctx.globalAlpha = alpha * (1 - d / (barrierW() * 1.8)) * 0.6;
          ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = alpha;
    nodes.forEach(n => {
      ctx.fillStyle = '#dff4ff'; ctx.shadowColor = '#5ad1ff'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(n.x, n.y, 2.6, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }
  function drawRippleStatic() {
    ctx.strokeStyle = '#5ad1ff'; ctx.globalAlpha = 0.3; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
