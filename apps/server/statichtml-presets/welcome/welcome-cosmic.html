<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Token00 · 深空星海欢迎页</title>
<style>
  :root { --c1: #3df0ff; --c2: #9b6bff; --c3: #4d7cff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #02030a; overflow: hidden; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; }
  .ui {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; padding-bottom: 11vh; z-index: 3; pointer-events: none;
    opacity: 0; transition: opacity 1.2s ease;
  }
  .ui.show { opacity: 1; pointer-events: auto; }
  .btns { display: flex; gap: 20px; }
  .btn {
    pointer-events: auto; cursor: pointer; user-select: none; padding: 14px 44px; font-size: 16px;
    letter-spacing: 5px; color: #dff; background: rgba(61,240,255,0.05);
    border: 1px solid rgba(61,240,255,0.5); border-radius: 30px; transition: all .35s ease;
    box-shadow: 0 0 16px rgba(61,240,255,0.2), inset 0 0 14px rgba(155,107,255,0.12);
  }
  .btn:hover { background: rgba(155,107,255,0.18); border-color: var(--c2);
    color: #fff; box-shadow: 0 0 28px rgba(155,107,255,0.55); }
  .btn.primary { color: #02030a; background: linear-gradient(120deg, var(--c1), var(--c2));
    border: none; box-shadow: 0 0 26px rgba(155,107,255,0.6); }
  .btn.primary:hover { background: #fff; box-shadow: 0 0 32px rgba(255,255,255,0.8); }
  .cap {
    position: fixed; left: 0; right: 0; top: 15vh; text-align: center; z-index: 3; color: #eaf6ff;
    letter-spacing: 12px; font-size: 26px; font-weight: 300; opacity: 0; transition: opacity 1s ease;
    text-shadow: 0 0 22px rgba(61,240,255,0.6);
  }
  .cap.show { opacity: 1; }
  .sub {
    position: fixed; left: 0; right: 0; top: calc(15vh + 40px); text-align: center; z-index: 3;
    color: rgba(155,107,255,0.8); letter-spacing: 5px; font-size: 12px; opacity: 0; transition: opacity 1s ease;
  }
  .sub.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap" id="cap">智能，正在降临</div>
<div class="sub" id="sub">FROM THE DEEP · A NEW CIVILIZATION</div>
<div class="ui" id="ui">
  <div class="btns">
    <div class="btn primary" id="enter">进 入</div>
    <div class="btn" id="replay">重 播</div>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const cap = document.getElementById('cap');
  const sub = document.getElementById('sub');
  const ui = document.getElementById('ui');
  const C1 = '#3df0ff', C2 = '#9b6bff', C3 = '#4d7cff';
  let W, H, DPR, cx, cy;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); cx = W / 2; cy = H / 2; buildStars();
  }
  const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
  const easeIn = t => t * t * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const shellR = () => Math.min(W, H) * 0.26;
  let stars = [];
  function buildStars() {
    stars = [];
    const n = Math.round((W * H) / 2600);
    for (let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H,
      r: rand(0.3, 1.6), a: rand(0.2, 1), ph: rand(0, 6.28), sp: rand(0.5, 2) });
  }
  window.addEventListener('resize', resize); resize();

  const N = 9;
  let comets = [];
  function spawn() {
    comets = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2 + rand(-0.2, 0.2), r = Math.max(W, H) * 0.8;
      const sx = cx + Math.cos(a) * r, sy = cy + Math.sin(a) * r * 0.92;
      const ta = rand(0, 6.28);
      comets.push({ sx, sy, tx: cx + Math.cos(ta) * shellR() * 0.9, ty: cy + Math.sin(ta) * shellR() * 0.9,
        size: rand(2, 4.5), col: [C1, C2, C3][i % 3], delay: rand(0, 0.5), trail: [] });
    }
  }
  let shards = [];
  function shatter() {
    shards = [];
    for (let i = 0; i < 70; i++) { const a = rand(0, 6.28), sp = rand(1, 5);
      shards.push({ a, sp, life: 1, len: rand(4, 16), col: [C1, C2, C3][i % 3] }); }
  }
  let civ = [];
  function buildCiv() {
    civ = []; const arms = 3, per = 18;
    for (let arm = 0; arm < arms; arm++) for (let i = 0; i < per; i++) {
      const tt = i / per, a = arm * (6.28 / arms) + tt * 4.2, rr = shellR() * (0.3 + tt * 1.5);
      civ.push({ a, rr, x: 0, y: 0, col: [C1, C2, C3][arm % 3], ph: rand(0, 6.28) });
    }
  }
  spawn(); buildCiv();

  const T_AP = 2.4, T_IM = 3.4, T_BL = 3.6, T_RP = 6.0, T_END = 8.8;
  let start = performance.now(), ripples = [], flash = 0, reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function reset() {
    start = performance.now(); shards = []; ripples = []; flash = 0; spawn(); buildCiv();
    ui.classList.remove('show'); cap.classList.remove('show'); sub.classList.remove('show');
  }
  document.getElementById('replay').addEventListener('click', reset);
  document.getElementById('enter').addEventListener('click', () => {
    if (window.self !== window.top) window.parent.postMessage({ type: 'welcome:close' }, '*');
    else { const f = document.body; f.style.transition = 'opacity .6s'; f.style.opacity = '0';
      setTimeout(() => { f.style.opacity = '1'; }, 600); }
  });

  function drawStars(t) {
    ctx.save();
    stars.forEach(s => {
      const tw = 0.6 + 0.4 * Math.sin(t * s.sp + s.ph);
      ctx.globalAlpha = s.a * tw; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    });
    ctx.restore();
  }
  function drawNebula() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const blobs = [[cx - W * 0.2, cy - H * 0.15, '#3a1d6e', 0.5], [cx + W * 0.25, cy + H * 0.1, '#0e3b46', 0.45],
      [cx, cy - H * 0.25, '#2a1a5e', 0.4]];
    blobs.forEach(b => { const g = ctx.createRadialGradient(b[0], b[1], 0, b[0], b[1], Math.max(W, H) * 0.55);
      g.addColorStop(0, b[2]); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = b[3]; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); });
    ctx.restore();
  }
  function drawShell(alpha) {
    const R = shellR();
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.strokeStyle = 'rgba(155,200,255,0.85)'; ctx.lineWidth = 3;
    ctx.shadowColor = C1; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.28); ctx.stroke();
    // 内能量环
    ctx.strokeStyle = 'rgba(61,240,255,0.4)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.82, 0, 6.28); ctx.stroke();
    // 刻度
    for (let i = 0; i < 48; i++) { const a = (i / 48) * 6.28;
      ctx.globalAlpha = alpha * 0.6; ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
      ctx.lineTo(cx + Math.cos(a) * R * 1.06, cy + Math.sin(a) * R * 1.06); ctx.stroke(); }
    ctx.restore();
  }
  function drawCiv(alpha) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'lighter';
    civ.forEach(p => { const rr = p.rr + Math.sin(performance.now() / 900 + p.ph) * 8;
      p.x = cx + Math.cos(p.a + performance.now() / 4000) * rr; p.y = cy + Math.sin(p.a + performance.now() / 4000) * rr; });
    for (let i = 0; i < civ.length; i++) for (let j = i + 1; j < civ.length; j++) {
      const d = Math.hypot(civ[i].x - civ[j].x, civ[i].y - civ[j].y);
      if (d < shellR() * 0.5) { ctx.globalAlpha = alpha * (1 - d / (shellR() * 0.5)) * 0.5;
        ctx.strokeStyle = civ[i].col; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(civ[i].x, civ[i].y); ctx.lineTo(civ[j].x, civ[j].y); ctx.stroke(); }
    }
    ctx.globalAlpha = alpha;
    civ.forEach(p => { ctx.fillStyle = '#fff'; ctx.shadowColor = p.col; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 6.28); ctx.fill(); });
    ctx.restore();
  }

  function frame(now) {
    const t = (now - start) / 1000;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H);
    const tt = now / 1000;
    drawNebula(); drawStars(tt);

    if (reduced) {
      drawCiv(1);
      if (!ui.classList.contains('show')) { ui.classList.add('show'); cap.textContent = '进入 AI 科技文明';
        cap.classList.add('show'); sub.classList.add('show'); }
      requestAnimationFrame(frame); return;
    }

    if (t > 0.3 && t < T_IM) { cap.textContent = '智能，正在降临'; cap.classList.add('show'); sub.classList.add('show'); }
    if (t >= T_IM) cap.textContent = '进入 AI 科技文明';

    if (t < T_IM) {
      const ba = t < T_AP ? 1 : Math.max(0, 1 - (t - T_AP) / (T_IM - T_AP));
      drawShell(ba * 0.95);
      comets.forEach(c => {
        const lt = (t - c.delay) / (T_AP - c.delay), p = easeIn(Math.max(0, Math.min(1, lt)));
        const x = c.sx + (c.tx - c.sx) * p, y = c.sy + (c.ty - c.sy) * p;
        c.trail.push({ x, y }); if (c.trail.length > 18) c.trail.shift();
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (let k = 0; k < c.trail.length - 1; k++) {
          ctx.globalAlpha = (k / c.trail.length) * 0.7; ctx.strokeStyle = c.col; ctx.lineWidth = c.size * (k / c.trail.length);
          ctx.beginPath(); ctx.moveTo(c.trail[k].x, c.trail[k].y); ctx.lineTo(c.trail[k + 1].x, c.trail[k + 1].y); ctx.stroke();
        }
        ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.shadowColor = c.col; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(x, y, c.size, 0, 6.28); ctx.fill(); ctx.restore();
      });
    }

    if (t >= T_AP && t < T_BL) {
      const k = t - T_AP; flash = Math.max(flash, Math.max(0, 1 - k * 1.5));
      drawShell(Math.max(0, 0.95 - k * 2));
      if (shards.length === 0) shatter();
      // 超新星闪白
      if (flash > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = flash * 0.7;
        const fg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.5);
        fg.addColorStop(0, '#ffffff'); fg.addColorStop(0.3, 'rgba(200,230,255,0.7)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H); ctx.restore(); }
      // 冲击波
      const wr = k * 620; ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.max(0, 0.7 - k * 0.7); ctx.strokeStyle = C1; ctx.lineWidth = 3;
      ctx.shadowColor = C1; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(cx, cy, wr, 0, 6.28); ctx.stroke(); ctx.restore();
      // 碎片
      shards.forEach(s => { const d = s.sp * k * 80; s.life = Math.max(0, 1 - k / 0.8);
        const x = cx + Math.cos(s.a) * d, y = cy + Math.sin(s.a) * d;
        ctx.globalAlpha = s.life; ctx.strokeStyle = s.col; ctx.lineWidth = 1.6; ctx.shadowColor = s.col; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(s.a) * s.len * s.life, y - Math.sin(s.a) * s.len * s.life); ctx.stroke(); });
      ctx.globalAlpha = 1;
    }

    if (t >= T_BL) { const be = ease(Math.min(1, (t - T_BL) / 1.4)); drawCiv(be); }

    if (t >= T_RP) {
      const rk = t - T_RP;
      if (t < T_RP + 0.05) ripples = [0, 0.4, 0.8];
      // 引力波纹
      ripples.forEach(off => { const rr = (rk - off) * 260;
        if (rr > 0 && rr < Math.max(W, H)) {
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = Math.max(0, 0.45 - (rk - off) * 0.14);
          ctx.strokeStyle = [C1, C2, C3][ripples.indexOf(off) % 3]; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 6.28); ctx.stroke(); ctx.restore();
        } });
      ctx.globalAlpha = 1;
    }

    if (t > T_END - 1.2 && !ui.classList.contains('show')) { ui.classList.add('show'); cap.classList.add('show'); sub.classList.add('show'); }
    if (t > T_END + 4) reset();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
