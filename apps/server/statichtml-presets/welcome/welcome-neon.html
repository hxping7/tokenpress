<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Token00 · 赛博霓虹欢迎页</title>
<style>
  :root { --m: #ff2bd6; --c: #00f0ff; --g: #b6ff3a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #05000d; overflow: hidden; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; }
  /* 扫描线 + 暗角 */
  .scan {
    position: fixed; inset: 0; pointer-events: none; z-index: 2; mix-blend-mode: overlay;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px);
  }
  .vig { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    box-shadow: inset 0 0 220px 40px rgba(0,0,0,0.85); }
  .ui {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; padding-bottom: 11vh; z-index: 3; pointer-events: none;
    opacity: 0; transition: opacity .9s ease;
  }
  .ui.show { opacity: 1; pointer-events: auto; }
  .btns { display: flex; gap: 20px; }
  .btn {
    pointer-events: auto; cursor: pointer; user-select: none; padding: 14px 42px; font-size: 16px;
    letter-spacing: 5px; color: var(--c); background: rgba(0,240,255,0.05);
    border: 1px solid var(--c); border-radius: 3px; transition: all .3s ease;
    text-shadow: 0 0 8px var(--c); box-shadow: 0 0 14px rgba(0,240,255,0.25), inset 0 0 14px rgba(0,240,255,0.12);
  }
  .btn:hover { background: rgba(0,240,255,0.18); box-shadow: 0 0 26px rgba(0,240,255,0.6); }
  .btn.primary { color: #05000d; background: var(--m); border-color: var(--m); text-shadow: none;
    box-shadow: 0 0 22px rgba(255,43,214,0.6); }
  .btn.primary:hover { background: #fff; border-color: #fff; box-shadow: 0 0 30px rgba(255,255,255,0.8); }
  .cap {
    position: fixed; left: 0; right: 0; top: 15vh; text-align: center; z-index: 3;
    color: #fff; letter-spacing: 10px; font-size: 26px; font-weight: 700; opacity: 0;
    transition: opacity .8s ease; text-shadow: 2px 0 var(--m), -2px 0 var(--c);
  }
  .cap.show { opacity: 1; }
  .sub {
    position: fixed; left: 0; right: 0; top: calc(15vh + 38px); text-align: center; z-index: 3;
    color: var(--g); letter-spacing: 4px; font-size: 12px; opacity: 0; transition: opacity .8s ease;
    text-shadow: 0 0 8px var(--g);
  }
  .sub.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="scan"></div><div class="vig"></div>
<div class="cap" id="cap">智能，正在降临</div>
<div class="sub" id="sub">SYSTEM · BREACH · INCOMING</div>
<div class="ui" id="ui">
  <div class="btns">
    <div class="btn primary" id="enter">进 入</div>
    <div class="btn" id="replay">重 播</div>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const cap = document.getElementById('cap');
  const sub = document.getElementById('sub');
  const ui = document.getElementById('ui');
  const C = '#00f0ff', M = '#ff2bd6', G = '#b6ff3a';
  let W, H, DPR, cx, cy;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); cx = W / 2; cy = H / 2;
  }
  window.addEventListener('resize', resize); resize();
  const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
  const easeIn = t => t * t * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const bW = () => Math.min(W * 0.18, 170), bH = () => Math.min(H * 0.66, 540);

  const glyphs = ['AI', '▣', '⬢', '知', '智', '⌬', '⚡', '◈'];
  const N = 9;
  let items = [];
  function spawn() {
    items = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2 + rand(-0.25, 0.25);
      const r = Math.max(W, H) * 0.75;
      const sx = cx + Math.cos(a) * r, sy = cy + Math.sin(a) * r * 0.95;
      const sx2 = cx + (Math.random() < .5 ? -1 : 1) * bW() * 0.5;
      const sy2 = cy + rand(-bH() * 0.42, bH() * 0.42);
      items.push({ ch: glyphs[i % glyphs.length], sx, sy, tx: sx2, ty: sy2,
        size: rand(18, 34), col: [C, M, G][i % 3], delay: rand(0, 0.45), trail: [] });
    }
  }
  let sparks = [];
  function burst() {
    sparks = [];
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * Math.PI * 2, sp = rand(2, 9);
      sparks.push({ a, sp, life: 1, len: rand(8, 26), col: [C, M, G][i % 3] });
    }
  }
  let nodes = [];
  function buildNet() {
    nodes = [];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2, r = rand(bW() * 0.9, bW() * 2.6);
      nodes.push({ a, base: r, ph: rand(0, 6.28), x: 0, y: 0, col: [C, M, G][i % 3] });
    }
  }
  let cracks = [];
  function buildCracks() {
    cracks = [];
    for (let i = 0; i < 13; i++) cracks.push({ a: rand(0, 6.28), len: rand(bW() * 0.4, bW() * 1.7), seg: rand(5, 10) | 0 });
  }
  spawn(); buildNet(); buildCracks();

  const T_AP = 2.3, T_IM = 3.3, T_BL = 3.5, T_RP = 6.0, T_END = 8.4;
  let start = performance.now(), ripples = [], glitch = 0, reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function reset() {
    start = performance.now(); sparks = []; cracks = []; ripples = []; glitch = 0;
    spawn(); buildNet(); buildCracks();
    ui.classList.remove('show'); cap.classList.remove('show'); sub.classList.remove('show');
  }
  document.getElementById('replay').addEventListener('click', reset);
  document.getElementById('enter').addEventListener('click', () => {
    if (window.self !== window.top) window.parent.postMessage({ type: 'welcome:close' }, '*');
    else { const f = document.body; f.style.transition = 'opacity .6s'; f.style.opacity = '0';
      setTimeout(() => { f.style.opacity = '1'; }, 600); }
  });

  function neonRect(x, y, w, h, col, lw, a) {
    ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.shadowColor = col; ctx.shadowBlur = 16;
    ctx.strokeRect(x, y, w, h); ctx.restore();
  }
  function drawBarrier(alpha, shake) {
    const bw = bW(), bh = bH();
    const dx = shake ? rand(-shake, shake) : 0, dy = shake ? rand(-shake, shake) : 0;
    // RGB 撕裂
    neonRect(cx - bw / 2 + dx - 3, cy - bh / 2 + dy, bw, bh, M, 1.4, alpha * 0.5);
    neonRect(cx - bw / 2 + dx + 3, cy - bh / 2 + dy, bw, bh, C, 1.4, alpha * 0.5);
    neonRect(cx - bw / 2 + dx, cy - bh / 2 + dy, bw, bh, '#ffffff', 1.6, alpha);
    // 内部电路格
    ctx.save(); ctx.globalAlpha = alpha * 0.4; ctx.strokeStyle = C; ctx.lineWidth = 1;
    ctx.shadowColor = C; ctx.shadowBlur = 6;
    for (let i = 1; i < 5; i++) { const x = cx - bw / 2 + (bw / 5) * i + dx;
      ctx.beginPath(); ctx.moveTo(x, cy - bh / 2 + dy); ctx.lineTo(x, cy + bh / 2 + dy); ctx.stroke(); }
    for (let j = 1; j < 16; j++) { const y = cy - bh / 2 + (bh / 16) * j + dy;
      ctx.beginPath(); ctx.moveTo(cx - bw / 2 + dx, y); ctx.lineTo(cx + bw / 2 + dx, y); ctx.stroke(); }
    ctx.restore();
  }
  function drawNet(alpha) {
    ctx.save(); ctx.globalAlpha = alpha;
    nodes.forEach(n => { const rr = n.base + Math.sin(performance.now() / 800 + n.ph) * 12;
      n.x = cx + Math.cos(n.a) * rr; n.y = cy + Math.sin(n.a) * rr; });
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
      if (d < bW() * 1.9) { ctx.globalAlpha = alpha * (1 - d / (bW() * 1.9)) * 0.7;
        ctx.strokeStyle = nodes[i].col; ctx.lineWidth = 1; ctx.shadowColor = nodes[i].col; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke(); }
    }
    ctx.globalAlpha = alpha;
    nodes.forEach(n => { ctx.fillStyle = '#fff'; ctx.shadowColor = n.col; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(n.x, n.y, 2.8, 0, 6.28); ctx.fill(); });
    ctx.restore();
  }

  function frame(now) {
    const t = (now - start) / 1000;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#05000d'; ctx.fillRect(0, 0, W, H);
    // 远景网格地平线
    ctx.save(); ctx.globalAlpha = 0.12; ctx.strokeStyle = C; ctx.lineWidth = 1;
    for (let i = 0; i <= 12; i++) { const y = cy + (i / 12) * H * 0.6;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();

    if (reduced) {
      drawBarrier(0, 0); drawNet(1);
      if (!ui.classList.contains('show')) { ui.classList.add('show'); cap.textContent = '进入 AI 科技文明';
        cap.classList.add('show'); sub.classList.add('show'); }
      requestAnimationFrame(frame); return;
    }

    if (t > 0.3 && t < T_IM) { cap.textContent = '智能，正在降临'; cap.classList.add('show'); sub.classList.add('show'); }
    if (t >= T_IM) cap.textContent = '进入 AI 科技文明';

    if (t < T_IM) {
      const ba = t < T_AP ? 1 : Math.max(0, 1 - (t - T_AP) / (T_IM - T_AP));
      drawBarrier(ba * 0.95, t > T_AP - 0.3 ? 1.5 : 0);
      items.forEach(it => {
        const lt = (t - it.delay) / (T_AP - it.delay), p = easeIn(Math.max(0, Math.min(1, lt)));
        const x = it.sx + (it.tx - it.sx) * p, y = it.sy + (it.ty - it.sy) * p;
        it.trail.push({ x, y }); if (it.trail.length > 16) it.trail.shift();
        for (let k = 0; k < it.trail.length - 1; k++) {
          ctx.globalAlpha = (k / it.trail.length) * 0.5; ctx.strokeStyle = it.col; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(it.trail[k].x, it.trail[k].y); ctx.lineTo(it.trail[k + 1].x, it.trail[k + 1].y); ctx.stroke();
        }
        ctx.globalAlpha = 1; ctx.save(); ctx.translate(x, y); ctx.fillStyle = it.col;
        ctx.font = '700 ' + it.size + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.shadowColor = it.col; ctx.shadowBlur = 14; ctx.fillText(it.ch, 0, 0); ctx.restore();
      });
    }

    if (t >= T_AP && t < T_BL) {
      const k = t - T_AP; glitch = k < 0.5 ? 1 : 0;
      drawBarrier(Math.max(0, 0.95 - k * 1.5), 3 * (1 - k / 0.5));
      // RGB 裂纹
      ctx.save(); ctx.translate(cx, cy);
      cracks.forEach(c => { let px = 0, py = 0; const ce = ease(Math.min(1, k / 0.6));
        for (let s = 1; s <= c.seg; s++) { const rr = (c.len / c.seg) * s * ce, wob = Math.sin(s * 1.9) * 7 * (s / c.seg);
          const nx = Math.cos(c.a) * rr - Math.sin(c.a) * wob, ny = Math.sin(c.a) * rr + Math.cos(c.a) * wob;
          ctx.globalAlpha = 0.8; ctx.lineWidth = 1.6; ctx.shadowBlur = 8;
          ctx.strokeStyle = C; ctx.beginPath(); ctx.moveTo(px - 2, py); ctx.lineTo(nx - 2, ny); ctx.stroke();
          ctx.strokeStyle = M; ctx.beginPath(); ctx.moveTo(px + 2, py); ctx.lineTo(nx + 2, ny); ctx.stroke();
          px = nx; py = ny; } });
      ctx.restore();
      // 故障切片
      if (glitch && Math.random() < 0.6) {
        const sy = rand(0, H), sh = rand(4, 22), off = rand(-30, 30);
        ctx.drawImage(cv, 0, sy * DPR, cv.width, sh * DPR, off, sy, W, sh);
      }
      const wr = k * 560; ctx.globalAlpha = Math.max(0, 0.6 - k * 0.6);
      ctx.strokeStyle = C; ctx.lineWidth = 2.5; ctx.shadowColor = C; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(cx, cy, wr, 0, 6.28); ctx.stroke();
      if (sparks.length === 0) burst();
      sparks.forEach(s => { const d = s.sp * k * 70; s.life = Math.max(0, 1 - k / 0.8);
        const x = cx + Math.cos(s.a) * d, y = cy + Math.sin(s.a) * d;
        ctx.globalAlpha = s.life; ctx.strokeStyle = s.col; ctx.lineWidth = 1.6; ctx.shadowColor = s.col; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(s.a) * s.len * s.life, y - Math.sin(s.a) * s.len * s.life); ctx.stroke(); });
      ctx.globalAlpha = 1;
    }

    if (t >= T_BL) { const be = ease(Math.min(1, (t - T_BL) / 1.2)); drawNet(be); }

    if (t >= T_RP) {
      const rk = t - T_RP;
      if (t < T_RP + 0.05) ripples = [0, 0.3, 0.6];
      ripples.forEach(off => { const rr = (rk - off) * 280;
        if (rr > 0 && rr < Math.max(W, H)) {
          ctx.globalAlpha = Math.max(0, 0.5 - (rk - off) * 0.16); ctx.strokeStyle = C; ctx.lineWidth = 1.6;
          ctx.shadowColor = C; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 6.28); ctx.stroke();
        } });
      ctx.globalAlpha = 1;
    }

    if (t > T_END - 1.1 && !ui.classList.contains('show')) { ui.classList.add('show'); cap.classList.add('show'); sub.classList.add('show'); }
    if (t > T_END + 4) reset();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
