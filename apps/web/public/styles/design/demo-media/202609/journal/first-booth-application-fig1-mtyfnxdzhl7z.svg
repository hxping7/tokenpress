<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="642" viewBox="0 0 1200 642">
  <rect width="1200" height="642" fill="#f5f3ee"/>
  <rect x="80" y="80" width="46" height="3" fill="#a8311f"/>
  <text x="142" y="88" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#a8311f" letter-spacing="2">申报材料清单</text>
  <rect x="80" y="128" width="1040" height="1" fill="#1a1a1a" opacity="0.35"/>
  <text x="96" y="168" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">身份材料</text><text x="400" y="168" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">身份证正反面扫描件</text><rect x="80" y="190" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="230" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">作品资料</text><text x="400" y="230" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">6–10 张成品图，白底或统一背景</text><rect x="80" y="252" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="292" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">作品说明</text><text x="400" y="292" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">名称 / 尺寸 / 材质 / 工时，逐件填写</text><rect x="80" y="314" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="354" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">工艺说明</text><text x="400" y="354" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">原创或授权声明，需签字</text><rect x="80" y="376" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="416" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">展位需求</text><text x="400" y="416" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">尺寸、是否需要电源、桌数</text><rect x="80" y="438" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="478" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">联系方式</text><text x="400" y="478" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">手机 + 邮箱，务必与账号一致</text><rect x="80" y="500" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="540" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">缴费凭证</text><text x="400" y="540" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">审核通过后按指引入账并回传</text><rect x="80" y="562" width="1040" height="1" fill="#e3ddd0"/>
</svg>
