  <circle cx="110" cy="210" r="30" fill="#a8311f" opacity="0.90"/><text x="110" y="219" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#ffffff">1</text><text x="110" y="286" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" fill="#1a1a1a">定分模面</text><text x="110" y="320" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" fill="#8c8880">先找最大截面</text><circle cx="322" cy="210" r="30" fill="#a8311f" opacity="0.90"/><text x="322" y="219" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#ffffff">2</text><text x="322" y="286" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" fill="#1a1a1a">查倒扣</text><text x="322" y="320" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" fill="#8c8880">逐角度扫</text><circle cx="534" cy="210" r="30" fill="#a8311f" opacity="0.90"/><text x="534" y="219" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#ffffff">3</text><text x="534" y="286" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" fill="#1a1a1a">分包模泥</text><text x="534" y="320" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" fill="#8c8880">留 20mm 边</text><circle cx="746" cy="210" r="30" fill="#a8311f" opacity="0.90"/><text x="746" y="219" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#ffffff">4</text><text x="746" y="286" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" fill="#1a1a1a">设注/排气</text><text x="746" y="320" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" fill="#8c8880">高处排气</text><circle cx="958" cy="210" r="30" fill="#a8311f" opacity="0.90"/><text x="958" y="219" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#ffffff">5</text><text x="958" y="286" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" fill="#1a1a1a">选硬度</text><text x="958" y="320" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" fill="#8c8880">按倒扣定</text><circle cx="1170" cy="210" r="30" fill="#a8311f" opacity="0.90"/><text x="1170" y="219" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#ffffff">6</text><text x="1170" y="286" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" fill="#1a1a1a">开模试灌</text><text x="1170" y="320" text-anchor="middle" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" fill="#8c8880">验气泡</text>
