<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704">
  <rect width="1200" height="704" fill="#f5f3ee"/>
  <rect x="80" y="80" width="46" height="3" fill="#a8311f"/>
  <text x="142" y="88" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#a8311f" letter-spacing="2">PU 灌注参数记录</text>
  <rect x="80" y="128" width="1040" height="1" fill="#1a1a1a" opacity="0.35"/>
  <text x="96" y="168" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">树脂类型</text><text x="400" y="168" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">双组分 PU，1:1（体积比）</text><rect x="80" y="190" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="230" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">环境温度</text><text x="400" y="230" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">25 ± 2 ℃（低于 18℃ 需预热模具）</text><rect x="80" y="252" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="292" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">树脂预热</text><text x="400" y="292" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">A 组分 30℃ 水浴 10 分钟</text><rect x="80" y="314" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="354" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">凝胶时间（25℃）</text><text x="400" y="354" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">约 3 分 30 秒</text><rect x="80" y="376" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="416" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">脱模时间</text><text x="400" y="416" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">45 分钟（手感不粘即可）</text><rect x="80" y="438" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="478" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">线性收缩率</text><text x="400" y="478" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">1.5% – 3%（按品牌实测）</text><rect x="80" y="500" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="540" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">补偿方式</text><text x="400" y="540" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">原型放大 1.02 倍后翻模</text><rect x="80" y="562" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="602" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">脱泡方式</text><text x="400" y="602" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">真空 -0.09MPa，60 秒</text><rect x="80" y="624" width="1040" height="1" fill="#e3ddd0"/>
</svg>
