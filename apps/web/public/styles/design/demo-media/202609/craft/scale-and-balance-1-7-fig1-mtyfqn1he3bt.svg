<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <rect width="1200" height="580" fill="#f5f3ee"/>
  <rect x="80" y="80" width="46" height="3" fill="#a8311f"/>
  <text x="142" y="88" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#a8311f" letter-spacing="2">1/7 站姿参数参考</text>
  <rect x="80" y="128" width="1040" height="1" fill="#1a1a1a" opacity="0.35"/>
  <text x="96" y="168" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">总高（含底座）</text><text x="400" y="168" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">230 ± 5 mm</text><rect x="80" y="190" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="230" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">头高（发顶到下巴）</text><text x="400" y="230" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">28 – 31 mm（约 1/7.5）</text><rect x="80" y="252" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="292" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">重心高度（自脚底起）</text><text x="400" y="292" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">120 – 135 mm</text><rect x="80" y="314" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="354" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">支撑面宽度（双脚）</text><text x="400" y="354" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">≥ 42 mm</text><rect x="80" y="376" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="416" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">脚踝最小直径</text><text x="400" y="416" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">11 mm（受力侧）</text><rect x="80" y="438" width="1040" height="1" fill="#e3ddd0"/><text x="96" y="478" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="21" fill="#8c8880">重心投影</text><text x="400" y="478" font-family="Inter,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" fill="#1a1a1a">必须落在双脚连线所围区域内</text><rect x="80" y="500" width="1040" height="1" fill="#e3ddd0"/>
</svg>
