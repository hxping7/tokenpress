  <rect x="84" y="278" width="120" height="4" rx="2" fill="url(#acc)"/>
  <text x="84" y="332" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="23" fill="#64748b">不要让每个 Agent 自己判断「这个工具能不能调」。把权限判定下沉成网关的一道中间件</text><text x="84" y="366" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="23" fill="#64748b">，行为可观测、可回滚。</text>
