<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ROS 2 的延迟预算：控制环从 20ms 压到 4ms">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5ebff"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0f172a" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1150" cy="600" r="180" fill="#7c3aed" fill-opacity="0.05"/>
  <circle cx="90" cy="40" r="130" fill="#ec4899" fill-opacity="0.05"/>
  
  <rect x="880" y="56" width="200" height="200" rx="20" fill="#f5ebff" stroke="#7c3aed" stroke-opacity="0.22"/>
  <circle cx="980" cy="132" r="40" fill="url(#acc)" fill-opacity="0.85"/>
  <circle cx="964" cy="126" r="5" fill="#fff"/>
  <circle cx="996" cy="126" r="5" fill="#fff"/>
  <line x1="980" y1="92" x2="980" y2="68" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <circle cx="980" cy="64" r="6" fill="#ec4899"/>
  <path d="M932 200 q48 -20 96 0" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
  <rect x="84" y="104" width="56" height="5" rx="2.5" fill="url(#acc)"/>
  <text x="84" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="4" fill="#7c3aed" font-weight="600">ROBOTICS / ROS 2</text>
  <text x="84" y="232" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="62" font-weight="700" fill="#0f172a">ROS 2 的延迟预算：控制环从 20</text><text x="84" y="310" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="62" font-weight="700" fill="#0f172a">ms 压到 4ms</text>
  <rect x="84" y="356" width="120" height="4" rx="2" fill="url(#acc)"/>
  <text x="84" y="410" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="23" fill="#64748b">DDS 配置、QoS 策略、节点内通信与零拷贝——把一个控制环的延迟拆开算，才知道该优化</text><text x="84" y="444" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="23" fill="#64748b">谁。</text>
  <rect x="84" y="552" width="76.75" height="38" rx="19" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="122.375" y="577" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="17" fill="#475569">ROS 2</text>
  <rect x="172.75" y="552" width="98" height="38" rx="19" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="221.75" y="577" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="17" fill="#475569">延迟优化</text>
  <rect x="282.75" y="552" width="58.05" height="38" rx="19" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="311.775" y="577" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="17" fill="#475569">DDS</text>
  <text x="1116" y="576" text-anchor="end" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="19" font-weight="600" fill="#7c3aed" fill-opacity="0.85">极客手记</text>
  <rect x="0" y="622" width="1200" height="8" fill="url(#acc)"/>
</svg>
