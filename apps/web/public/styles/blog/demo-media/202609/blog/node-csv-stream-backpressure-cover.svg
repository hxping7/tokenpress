  <text x="84" y="232" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="62" font-weight="700" fill="#0f172a">2.1GB 的导出任务，内存怎么压</text><text x="84" y="310" font-family="Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="62" font-weight="700" fill="#0f172a">到 90MB</text>
  <rect x="84" y="356" width="120" height="4" rx="2" fill="url(#acc)"/>
