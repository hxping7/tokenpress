<svg xmlns="http://www.w3.org/2000/svg" width="360" height="126" viewBox="0 22 360 126" fill="none" role="img" aria-label="TokenPress">
  <defs>
    <linearGradient id="tp-ringGrad" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00d4ff"/>
      <stop offset="70%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tp-textGrad3" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60c0ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="tp-infGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="tp-glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tp-textGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="180" cy="86" rx="160" ry="62" fill="none" stroke="url(#tp-ringGrad)" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="180" cy="86" rx="142" ry="50" fill="none" stroke="#00d4ff" stroke-opacity="0.08" stroke-width="1"/>

  <line x1="24" y1="86" x2="64" y2="86" stroke="#00d4ff" stroke-width="0.5" opacity="0.4"/>
  <line x1="296" y1="86" x2="336" y2="86" stroke="#22d3ee" stroke-width="0.5" opacity="0.4"/>
  <circle cx="24" cy="86" r="2" fill="#00d4ff" opacity="0.6"/>
  <circle cx="336" cy="86" r="2" fill="#22d3ee" opacity="0.6"/>

  <text x="180" y="82" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" fill="url(#tp-textGrad3)" filter="url(#tp-textGlow3)">TokenPress</text>

  <g transform="translate(180, 108)" filter="url(#tp-glow3)">
    <path d="M 38 0 C 38 -16, 15 -16, 0 0 C -15 16, -38 16, -38 0 C -38 -16, -15 -16, 0 0 C 15 16, 38 16, 38 0 Z" fill="none" stroke="url(#tp-infGrad3)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-38" cy="0" r="3" fill="#00d4ff"/>
    <circle cx="38" cy="0" r="3" fill="#22d3ee"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <circle cx="90" cy="32" r="1" fill="#00d4ff" opacity="0.3"/>
  <circle cx="270" cy="32" r="1" fill="#22d3ee" opacity="0.3"/>
  <circle cx="80" cy="44" r="1" fill="#00d4ff" opacity="0.2"/>
  <circle cx="280" cy="44" r="1" fill="#22d3ee" opacity="0.2"/>

</svg>
