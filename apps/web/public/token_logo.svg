<svg xmlns="http://www.w3.org/2000/svg" width="560" height="215" viewBox="0 0 560 215" fill="none" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Token00 · 词元笔记</title>
  <desc id="logoDesc">Token00 博客 Logo：Token 渐变文字与无限符号组合，下方为「词元笔记」副标题</desc>
  <defs>
    <linearGradient id="logoTextGrad" x1="16" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ab8ff"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="logoInfGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="logoDivGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ab8ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5ab8ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5ab8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 字标：Token + 无限符号 -->
  <g transform="translate(50, 0)">
    <text x="16" y="100" font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="url(#logoTextGrad)">Token</text>
    <g transform="translate(368, 72)">
      <path d="M 70 0 C 70 -36, 28 -36, 0 0 C -28 36, -70 36, -70 0 C -70 -36, -28 -36, 0 0 C 28 36, 70 36, 70 0 Z" fill="none" stroke="url(#logoInfGrad)" stroke-width="9" stroke-linecap="round"/>
      <path d="M 50 0 C 50 -24, 20 -24, 0 0 C -20 24, -50 24, -50 0 C -50 -24, -20 -24, 0 0 C 20 24, 50 24, 50 0 Z" fill="none" stroke="rgba(0,212,255,0.2)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="rgba(255,255,255,0.5)"/>
    </g>
  </g>

  <!-- 分隔线 -->
  <line x1="200" y1="162" x2="360" y2="162" stroke="url(#logoDivGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- 副标题 -->
  <text x="280" y="200" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif" font-size="46" font-weight="700" letter-spacing="7" font-style="italic" fill="#5ab8ff">词元笔记</text>
</svg>
