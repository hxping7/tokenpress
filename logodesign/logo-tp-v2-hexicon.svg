<svg width="560" height="140" viewBox="0 0 560 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="140" fill="#050a14"/>
  <defs>
    <linearGradient id="tpHexBg" x1="0" y1="0" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2448"/>
      <stop offset="100%" stop-color="#1a0840"/>
    </linearGradient>
    <linearGradient id="tpHexBorder" x1="0" y1="0" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="tpInfGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffea"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="tpTextGrad2" x1="160" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f4ff"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8aaff"/>
    </linearGradient>
    <filter id="tpHexGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tpTextGlowV2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 六边形图标 (中心 70,70, 半径56) -->
  <polygon points="70,8 121,38 121,102 70,132 19,102 19,38"
    fill="url(#tpHexBg)"
    stroke="url(#tpHexBorder)"
    stroke-width="2.5"/>
  <!-- 内六边形 -->
  <polygon points="70,16 113,42 113,98 70,124 27,98 27,42"
    fill="none"
    stroke="rgba(0,212,255,0.1)"
    stroke-width="1.5"/>
  <!-- 六边形内∞符号 -->
  <g transform="translate(70,70)" filter="url(#tpHexGlow)">
    <path d="M 34 0 C 34 -18, 13 -18, 0 0 C -13 18, -34 18, -34 0 C -34 -18, -13 -18, 0 0 C 13 18, 34 18, 34 0 Z"
      fill="none"
      stroke="url(#tpInfGrad2)"
      stroke-width="5.5"
      stroke-linecap="round"
    />
    <circle cx="0" cy="0" r="3.5" fill="rgba(255,255,255,0.6)"/>
  </g>
  <!-- 六边形角装饰点 -->
  <circle cx="70" cy="8" r="3" fill="#00d4ff" opacity="0.7"/>
  <circle cx="121" cy="38" r="2.5" fill="#7c3aed" opacity="0.6"/>
  <circle cx="121" cy="102" r="2.5" fill="#00d4ff" opacity="0.5"/>

  <!-- 右侧文字区 -->
  <!-- 主标题 TokenPress -->
  <text x="158" y="85"
    font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif"
    font-size="56"
    font-weight="700"
    letter-spacing="1"
    fill="url(#tpTextGrad2)"
    filter="url(#tpTextGlowV2)">TokenPress</text>
  <!-- 副标题 -->
  <text x="162" y="114"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="6"
    fill="#1a4a6a">PRESS.TOKEN00.COM</text>
</svg>
