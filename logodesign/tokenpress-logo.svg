<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 144" width="620" height="144" fill="none" role="img" aria-label="TokenPress">
  <defs>
    <linearGradient id="logoTextGrad" x1="16" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ab8ff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="logoInfGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="logoGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="logoInfGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16,0)">
    <text x="16" y="102" font-family="'Segoe UI','SF Pro Display',Arial,sans-serif" font-size="70" font-weight="700" letter-spacing="-3" fill="url(#logoTextGrad)" filter="url(#logoGlow)">TokenPress</text>
    <g transform="translate(490,72)" filter="url(#logoInfGlow)">
      <path d="M 70 0 C 70 -36, 28 -36, 0 0 C -28 36, -70 36, -70 0 C -70 -36, -28 -36, 0 0 C 28 36, 70 36, 70 0 Z" fill="none" stroke="url(#logoInfGrad)" stroke-width="9" stroke-linecap="round"/>
      <path d="M 50 0 C 50 -24, 20 -24, 0 0 C -20 24, -50 24, -50 0 C -50 -24, -20 -24, 0 0 C 20 24, 50 24, 50 0 Z" fill="none" stroke="rgba(34,211,238,0.2)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="rgba(255,255,255,0.5)"/>
    </g>
  </g>
</svg>
