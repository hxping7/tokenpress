<svg width="680" height="144" viewBox="0 0 680 144" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="144" fill="#050a14"/>
  <defs>
    <linearGradient id="tpTextGrad1a" x1="16" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ab8ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="tpTextGrad1b" x1="460" y1="0" x2="680" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="tpInfGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="tpGlow1" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tpGlowStrong" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Token 文字 -->
  <text x="16" y="100"
    font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif"
    font-size="76"
    font-weight="700"
    letter-spacing="-1.5"
    fill="url(#tpTextGrad1a)"
    filter="url(#tpGlow1)">Token</text>

  <!-- ∞ 符号 — 作为连接 Token 和 Press 的桥梁 -->
  <g transform="translate(368, 72)" filter="url(#tpGlowStrong)">
    <path d="M 60 0 C 60 -32, 22 -32, 0 0 C -22 32, -60 32, -60 0 C -60 -32, -22 -32, 0 0 C 22 32, 60 32, 60 0 Z"
      fill="none"
      stroke="url(#tpInfGrad1)"
      stroke-width="8"
      stroke-linecap="round"
    />
    <path d="M 42 0 C 42 -20, 16 -20, 0 0 C -16 20, -42 20, -42 0 C -42 -20, -16 -20, 0 0 C 16 20, 42 20, 42 0 Z"
      fill="none"
      stroke="rgba(0,212,255,0.2)"
      stroke-width="2"
      stroke-linecap="round"
    />
    <circle cx="0" cy="0" r="3.5" fill="rgba(255,255,255,0.6)"/>
  </g>

  <!-- Press 文字 -->
  <text x="460" y="100"
    font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif"
    font-size="76"
    font-weight="700"
    letter-spacing="-0.5"
    fill="url(#tpTextGrad1b)"
    filter="url(#tpGlow1)">Press</text>

  <!-- 底部装饰线 — 从 Token 贯穿到 Press -->
  <line x1="16" y1="118" x2="664" y2="118" stroke="url(#tpInfGrad1)" stroke-width="0.8" opacity="0.25"/>
  <circle cx="16" cy="118" r="2.5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="664" cy="118" r="2.5" fill="#7c3aed" opacity="0.5"/>
</svg>
