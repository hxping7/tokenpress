<svg width="560" height="144" viewBox="0 0 560 144" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="144" fill="#050a14"/>
  <defs>
    <linearGradient id="textGrad1" x1="16" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ab8ff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="infGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow1" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Token 文字 -->
  <text x="16" y="100"
    font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif"
    font-size="92"
    font-weight="700"
    letter-spacing="-2"
    fill="url(#textGrad1)"
    filter="url(#glow1)">Token</text>

  <!-- ∞ 符号 — 紧随文字，垂直居中于字高 -->
  <g transform="translate(368, 72)" filter="url(#glowStrong)">
    <!-- 外层主体 -->
    <path d="M 70 0 C 70 -36, 28 -36, 0 0 C -28 36, -70 36, -70 0 C -70 -36, -28 -36, 0 0 C 28 36, 70 36, 70 0 Z"
      fill="none"
      stroke="url(#infGrad1)"
      stroke-width="9"
      stroke-linecap="round"
    />
    <!-- 内层细线 -->
    <path d="M 50 0 C 50 -24, 20 -24, 0 0 C -20 24, -50 24, -50 0 C -50 -24, -20 -24, 0 0 C 20 24, 50 24, 50 0 Z"
      fill="none"
      stroke="rgba(0,212,255,0.2)"
      stroke-width="2"
      stroke-linecap="round"
    />
    <!-- 中心点 -->
    <circle cx="0" cy="0" r="4" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- 底部装饰线 -->
  <line x1="16" y1="118" x2="544" y2="118" stroke="url(#infGrad1)" stroke-width="0.8" opacity="0.25"/>
  <!-- 左侧端点 -->
  <circle cx="16" cy="118" r="2.5" fill="#00d4ff" opacity="0.5"/>
  <!-- 右侧端点 -->
  <circle cx="544" cy="118" r="2.5" fill="#7c3aed" opacity="0.5"/>
</svg>
